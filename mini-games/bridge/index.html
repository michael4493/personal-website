<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>造橋英雄 - 我的小遊戲</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <a href="../../games.html" class="btn back-btn">←</a>
            <h2 data-i18n="game_bridge_title">造橋英雄</h2>
            <select id="language-select" class="lang-picker">
                <option value="zh-TW">繁體中文</option>
                <option value="en">English</option>
            </select>
        </div>
        
        <div class="controls-board">
            <div data-i18n="game_hold_to_build">長按滑鼠或螢幕建造橋樑</div>
            <div class="score-display">
                <span data-i18n="game_score">分數：</span>
                <span id="score">0</span>
            </div>
        </div>

        <div class="canvas-wrapper">
            <!-- 高度設定長一點，讓掉落感更明顯 -->
            <canvas id="gameCanvas" width="400" height="500"></canvas>
            
            <div id="gameOverScreen" class="hidden">
                <h3 data-i18n="game_over">遊戲結束！</h3>
                <button id="restartBtn" class="btn" data-i18n="btn_restart">重新開始</button>
            </div>
        </div>
    </div>

    <script src="../../js/main.js"></script>
    <script src="game.js"></script>
</body>
</html>
