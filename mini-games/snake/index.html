<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>貪吃蛇 - 我的小遊戲</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <a href="../../games.html" class="btn back-btn">←</a>
            <h2 data-i18n="game_snake_title">貪吃蛇</h2>
            <select id="language-select" class="lang-picker">
                <option value="zh-TW">繁體中文</option>
                <option value="en">English</option>
            </select>
        </div>
        
        <div class="controls-board">
            <div class="difficulty-selector">
                <span data-i18n="game_difficulty">難度：</span>
                <select id="difficultySelect" class="diff-picker">
                    <option value="150" data-i18n="diff_easy">簡單</option>
                    <option value="100" selected data-i18n="diff_normal">普通</option>
                    <option value="60" data-i18n="diff_hard">困難</option>
                </select>
            </div>
            <div class="score-display">
                <span data-i18n="game_score">分數：</span>
                <span id="score">0</span>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <div id="gameOverScreen" class="hidden">
                <h3 data-i18n="game_over">遊戲結束！</h3>
                <button id="restartBtn" class="btn" data-i18n="btn_restart">重新開始</button>
            </div>
        </div>

        <div class="virtual-keyboard">
            <div class="keyboard-row">
                <div class="key-spacer"></div>
                <button id="btn-up" class="nav-btn">W</button>
                <div class="key-spacer"></div>
            </div>
            <div class="keyboard-row">
                <button id="btn-left" class="nav-btn">A</button>
                <button id="btn-down" class="nav-btn">S</button>
                <button id="btn-right" class="nav-btn">D</button>
            </div>
        </div>
    </div>

    <script src="../../js/main.js"></script>
    <script src="game.js"></script>
</body>
</html>
